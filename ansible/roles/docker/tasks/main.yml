---
# Role "docker" - equivalent du script infra/install_docker.sh, en version idempotente.
# Peut etre relance autant de fois que necessaire sans effet de bord.

- name: Mettre a jour le cache apt
  apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Installer les prerequis
  apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present

- name: Creer le dossier des cles APT
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Telecharger la cle GPG officielle Docker
  get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'

- name: Ajouter le depot Docker
  apt_repository:
    repo: "deb [arch={{ ansible_architecture }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present
    filename: docker

- name: Installer Docker Engine et ses plugins
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: yes

- name: Ajouter l'utilisateur au groupe docker
  user:
    name: "{{ ansible_user }}"
    groups: docker
    append: yes

- name: S'assurer que le service Docker est actif et demarre au boot
  systemd:
    name: docker
    state: started
    enabled: yes
